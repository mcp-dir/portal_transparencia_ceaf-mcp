# Smithery configuration for Portal da Transparência: Cadastro de Expulsões da Administração Federal (CEAF)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_portal_transparencia_ceaf

name: portal_transparencia_ceaf-mcp
displayName: "Portal da Transparência: Cadastro de Expulsões da Administração Federal (CEAF)"
description: >
  Portal da Transparência: Cadastro de Expulsões da Administração Federal (CEAF), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/portal_transparencia_ceaf-mcp
repository: https://github.com/mcp-dir/portal_transparencia_ceaf-mcp

tags:
  - portal_transparencia_ceaf
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_portal_transparencia_ceaf

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_portal_transparencia_ceaf/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
